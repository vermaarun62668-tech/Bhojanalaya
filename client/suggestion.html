<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Suggestion</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-container">

    <form id="suggestionForm" class="form-card">

        <h1>💡 Suggest a Menu</h1>

        <textarea
            id="suggestion_text"
            rows="6"
            placeholder="Suggest a new food item..."
            required
        ></textarea>

        <button type="submit">
            Submit Suggestion
        </button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/suggestion.js"></script>

</body>
</html>
