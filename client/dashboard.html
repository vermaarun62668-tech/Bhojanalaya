<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student dashboard — view today's menu, rate food, submit complaints and suggestions.">
    <title>Dashboard — Bhojanalaya</title>

    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <a class="brand" href="index.html">🍽️ Bhojanalaya</a>
        <nav class="nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="rating.html">Rate Food</a>
            <a href="complaint.html">Complaint</a>
            <a href="suggestion.html">Suggest</a>
            <a href="login.html" id="logoutLink">Logout</a>
        </nav>
    </header>

    <div class="dashboard container" id="dashboardMain">

        <h2 id="welcome">Welcome Student 👋</h2>

        <div class="menu-card">

            <h3>📋 Today's Menu</h3>

            <p><strong>Breakfast:</strong> <span id="breakfast">Loading...</span></p>

            <p><strong>Lunch:</strong> <span id="lunch">Loading...</span></p>

            <p><strong>Snacks:</strong> <span id="snacks">Loading...</span></p>

            <p><strong>Dinner:</strong> <span id="dinner">Loading...</span></p>

        </div>

        <div class="actions">

            <a href="rating.html" class="btn" id="rateFoodBtn">⭐ Rate Food</a>

            <a href="complaint.html" class="btn" id="complaintBtn">📝 Complaint</a>

            <a href="suggestion.html" class="btn" id="suggestBtn">💡 Suggest Menu</a>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>

<script>
document.getElementById('logoutLink')?.addEventListener('click', function(e){
    localStorage.removeItem('token');
});
</script>

</body>
</html>
