<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Menu</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-container">

    <form id="menuForm" class="form-card">

        <h1>🍽 Update Today's Menu</h1>

        <input
            type="text"
            id="breakfast"
            placeholder="Breakfast"
            required
        >

        <input
            type="text"
            id="lunch"
            placeholder="Lunch"
            required
        >

        <input
            type="text"
            id="snacks"
            placeholder="Snacks"
            required
        >

        <input
            type="text"
            id="dinner"
            placeholder="Dinner"
            required
        >

        <button type="submit">
            Update Menu
        </button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/menu.js"></script>

</body>
</html>
